<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPTANCRAFT | COMMAND CENTER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-color: #f1c40f;
            --l-color: #53fc18;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- SİNEMATİK GİRİŞ --- */
        #entry-layer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 1.5s cubic-bezier(1, 0, 0, 1);
        }

        .scanline {
            width: 1px;
            height: 100%;
            background: var(--m-color);
            position: absolute;
            left: 50%;
            transform: scaleY(0);
            animation: scan 1.2s forwards cubic-bezier(0.85, 0, 0.15, 1);
        }

        @keyframes scan {
            0% { transform: scaleY(0); opacity: 1; }
            50% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(1); opacity: 0; width: 100%; left: 0; }
        }

        .entry-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 2rem;
            letter-spacing: 15px;
            opacity: 0;
            animation: reveal 0.5s 1s forwards;
        }

        @keyframes reveal { to { opacity: 1; letter-spacing: 25px; } }

        /* --- DASHBOARD --- */
        #app {
            height: 100vh;
            padding: 40px;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 1fr auto;
            gap: 20px;
            opacity: 0;
            transition: 2s;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        /* --- SOL PANEL (NAV) --- */
        .brand { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; margin-bottom: 40px; color: var(--m-color); }
        .nav-item {
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }
        .nav-item:hover { border-color: var(--border); background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: var(--m-color); color: #000; }

        /* --- ORTA PANEL (HERO) --- */
        .hero-panel {
            grid-column: 2;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-h { font-size: 8rem; font-weight: 900; line-height: 0.8; letter-spacing: -5px; text-align: center; }
        .hero-h span { display: block; font-size: 2.5rem; letter-spacing: 10px; font-family: 'Syncopate'; color: var(--m-color); }

        /* --- SAĞ PANEL (STATS) --- */
        .stat-card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .stat-val { font-size: 1.5rem; font-weight: 900; color: var(--l-color); display: block; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; letter-spacing: 2px; }

        /* --- ALT PANEL (ACTION) --- */
        .bottom-bar {
            grid-column: 1 / 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ip-bar {
            background: #fff;
            color: #000;
            padding: 15px 40px;
            border-radius: 100px;
            font-weight: 900;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.5s;
        }
        .ip-bar:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,255,255,0.2); }

        /* --- CURSOR --- */
        #c { position: fixed; width: 10px; height: 10px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 20000; mix-blend-mode: difference; }
        #c-r { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; z-index: 19999; transition: 0.1s ease-out; }

    </style>
</head>
<body>

    <div id="c"></div>
    <div id="c-r"></div>

    <div id="entry-layer">
        <div class="scanline"></div>
        <div class="entry-title">KAPTANCRAFT</div>
    </div>

    <div id="app">
        <aside class="panel">
            <div class="brand">KC SYSTEM</div>
            <a href="#" class="nav-item active"><i class="fas fa-home"></i> ANA SAYFA</a>
            <a href="https://kick.com/esentokat60" target="_blank" class="nav-item"><i class="fa-brands fa-kickstarter"></i> KICK CANLI</a>
            <a href="#" class="nav-item"><i class="fab fa-discord"></i> DISCORD</a>
            <a href="#" class="nav-item"><i class="fas fa-shopping-cart"></i> MARKET</a>
            <div style="margin-top: auto; font-size: 0.6rem; opacity: 0.3;">SYSTEM STATUS: STABLE</div>
        </aside>

        <main class="panel hero-panel">
            <h1 class="hero-h">KAPTAN<span>CRAFT</span></h1>
        </main>

        <section class="panel">
            <div class="stat-card">
                <span class="stat-label">SUNUCU SÜRÜMÜ</span>
                <span class="stat-val">1.21.4</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">DUNYA TURU</span>
                <span class="stat-val">SURVIVAL</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">LOKASYON</span>
                <span class="stat-val">TURKIYE</span>
            </div>
        </section>

        <footer class="panel bottom-bar">
            <div style="display: flex; gap: 20px;">
                <div><span style="opacity: 0.5; font-size: 0.7rem; display: block;">USER ID</span><span style="font-weight: 700;">GUEST_1337</span></div>
                <div><span style="opacity: 0.5; font-size: 0.7rem; display: block;">PING</span><span style="font-weight: 700; color: var(--l-color);">24MS</span></div>
            </div>

            <div class="ip-bar" onclick="copy()">
                <span id="ip">KaptanCraftt.aternos.me</span>
                <i class="fas fa-copy" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </div>
        </footer>
    </div>

    <script>
        // Entry Sequence
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('entry-layer').style.transform = 'translateY(-100%)';
                document.getElementById('app').style.opacity = '1';
            }, 2500);
        };

        // Custom Cursor
        const c = document.getElementById('c');
        const cr = document.getElementById('c-r');
        document.addEventListener('mousemove', e => {
            c.style.left = e.clientX + 'px';
            c.style.top = e.clientY + 'px';
            cr.style.left = e.clientX - 15 + 'px';
            cr.style.top = e.clientY - 15 + 'px';
        });

        // Copy
        function copy() {
            const ip = "KaptanCraftt.aternos.me";
            navigator.clipboard.writeText(ip);
            const el = document.getElementById('ip');
            el.innerText = "IP KOPYALANDI!";
            el.parentElement.style.background = "#53fc18";
            setTimeout(() => {
                el.innerText = ip;
                el.parentElement.style.background = "#fff";
            }, 2000);
        }
    </script>
</body>
</html>

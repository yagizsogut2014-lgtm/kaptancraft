<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPTANCRAFT | 1.21.4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-hex: #f1c40f;
            --k-hex: #53fc18;
            --accent-soft: rgba(241, 196, 15, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- ÖZEL MOUSE CURSOR --- */
        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--m-hex);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            mix-blend-mode: difference;
            transition: transform 0.1s;
        }

        /* --- GİRİŞ SEKANSI --- */
        #gate {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .shimmer {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #000, #fff, #000);
            background-size: 80% 100%;
            background-repeat: no-repeat;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
        }

        @keyframes shine { 0% { background-position: -500%; } 100% { background-position: 500%; } }

        /* --- ARKA PLAN --- */
        #canvas-bg { position: fixed; inset: 0; z-index: 1; }

        /* --- ANA PANEL --- */
        .viewport {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .main-frame {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            padding: 5rem;
            border-radius: 50px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        .main-frame::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(135deg, var(--m-hex), transparent, var(--k-hex));
            border-radius: 50px;
            z-index: -1;
            opacity: 0.3;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -3px;
        }

        .version-label {
            display: inline-block;
            padding: 8px 25px;
            background: var(--accent-soft);
            color: var(--m-hex);
            border: 1px solid var(--m-hex);
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .ip-controller {
            background: #fff;
            color: #000;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 40px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ip-controller:hover {
            transform: translateY(-10px) rotate(-1deg);
            box-shadow: 0 20px 40px rgba(241, 196, 15, 0.3);
        }

        .ip-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .nav-btn {
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .kick-zone { background: var(--k-hex); color: #000; grid-column: span 2; }
        .kick-zone:hover { filter: brightness(1.1); letter-spacing: 2px; }

        .sub-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .sub-btn:hover { background: #fff; color: #000; }

    </style>
</head>
<body>

    <div id="cursor"></div>

    <div id="gate">
        <div class="shimmer">KAPTANCRAFT</div>
    </div>

    <canvas id="canvas-bg"></canvas>

    <div class="viewport" id="view">
        <div class="main-frame">
            <div class="version-label">V.1.21.4 • ONLINE</div>
            <h1 class="hero-title">KAPTAN<br>CRAFT</h1>
            
            <div class="ip-controller" onclick="copyNet()">
                <span style="font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; display: block; margin-bottom: 5px;">Server Address</span>
                <span class="ip-code" id="ipDisp">KaptanCraftt.aternos.me</span>
            </div>

            <div class="link-grid">
                <a href="https://kick.com/esentokat60" target="_blank" class="nav-btn kick-zone">
                    <i class="fa-brands fa-kickstarter"></i> KICK.COM/ESENTOKAT60
                </a>
                <a href="#" class="nav-btn sub-btn"><i class="fab fa-discord"></i> DISCORD</a>
                <a href="#" class="btn nav-btn sub-btn"><i class="fas fa-store"></i> MARKET</a>
            </div>
        </div>
    </div>

    <script>
        // Preloader & Content Reveal
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('gate').style.transform = 'translateY(-100%)';
                document.getElementById('view').style.opacity = '1';
            }, 2500);
        };

        // Custom Cursor Logic
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // IP Copy Function
        function copyNet() {
            const ip = "KaptanCraftt.aternos.me";
            navigator.clipboard.writeText(ip);
            const disp = document.getElementById('ipDisp');
            disp.innerText = "COPIED TO CLIPBOARD";
            disp.style.color = "#53fc18";
            setTimeout(() => {
                disp.innerText = ip;
                disp.style.color = "#000";
            }, 2000);
        }

        // Animated Mesh Background
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Point {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        function setup() {
            pts = [];
            for (let i = 0; i < 60; i++) pts.push(new Point());
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(241, 196, 15, 0.15)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < pts.length; i++) {
                pts[i].update();
                for (let j = i + 1; j < pts.length; j++) {
                    let d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                    if (d < 200) {
                        ctx.beginPath();
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        setup();
        draw();
    </script>
</body>
</html>
